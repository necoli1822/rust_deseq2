[package]
name = "h5bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compare the pure-Rust HDF5 readers hdf5-pure and rust-hdf5"

[dependencies]
hdf5-pure = "0.47"
rust-hdf5 = "0.7"

[features]
# rust-hdf5's rayon-parallel chunk decompression
par = ["rust-hdf5/parallel"]

[profile.release]
debug = false

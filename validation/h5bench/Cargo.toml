[package]
name = "h5bench"
version = "0.1.0"
edition = "2021"
publish = false
description = "Compare the pure-Rust HDF5 readers hdf5-pure and rust-hdf5"

[dependencies]
hdf5-pure = "0.47"
rust-hdf5 = "0.7"
# only to switch flate2 (hdf5-pure's deflate) to its pure-Rust zlib-rs backend
flate2 = { version = "1.1", optional = true, features = ["zlib-rs"] }

[features]
# rust-hdf5's rayon-parallel chunk decompression
par = ["rust-hdf5/parallel"]
# hdf5-pure inflates with zlib-rs (the inflater rust-hdf5 uses) instead of miniz_oxide
zlibrs = ["dep:flate2"]

[profile.release]
debug = false

[package]
name = "rust_deseq2"
version = "0.1.0"
edition = "2021"
authors = ["Sunju Kim"]
description = "A pure Rust implementation of DESeq2 for differential expression analysis of RNA-seq data"
license = "MIT"
repository = "https://github.com/necoli1822/rust_deseq2"
homepage = "https://github.com/necoli1822/rust_deseq2"
keywords = ["bioinformatics", "rna-seq", "differential-expression", "deseq2", "genomics"]
categories = ["science", "command-line-utilities"]
rust-version = "1.89"
exclude = [
    "validation/",
    "reference/",
    "deseq2_source/",
    "DESeq2/",
    "test_data/",
    "scripts/",
    ".omc/",
    "python/",
]

[lib]
name = "rust_deseq2"
path = "src/lib.rs"

[[bin]]
name = "rust_deseq2"
path = "src/main.rs"

[dependencies]
# Array/matrix operations
ndarray = { version = "0.16", features = ["rayon"] }

# Statistics
statrs = { version = "0.19", default-features = false, features = ["std"] }
# Pure-Rust port of the fdlibm/musl math library, already in the tree through
# num-traits (statrs, ndarray); used for the C-library lgamma that R's stirlerr() calls.
libm = "0.2"

# Parallel processing
rayon = "1.10"

# Data I/O
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "2.0"

# Logging
log = "0.4"
env_logger = "0.11"

# HDF5 input (kallisto abundance.h5): pure Rust, no libhdf5. Chosen over hdf5-pure by
# validation/h5bench (built-in parallel chunk decompression); 0.x and released often,
# so the minor version is pinned. Optional so builds without HDF5 input can skip it.
rust-hdf5 = { version = "~0.7.9", optional = true, features = ["parallel"] }

[features]
default = ["hdf5"]
# read kallisto abundance.h5 files (--quant-type kallisto)
hdf5 = ["dep:rust-hdf5"]

[dev-dependencies]
tempfile = "3.24"
